# Rules C and D need to know, for each industry, what it depends on upstream
# (rule C: the manufacturing industry / supply chain) and who buys from it
# (rule D: customers and end markets). Terms are matched as whole words in news
# headlines and summaries: capitalised terms are case-sensitive, lowercase terms
# match any case. Industries use Yahoo's names with " - " instead of dashes.
# An industry not listed falls back to its sector's entry under `sectors`.

